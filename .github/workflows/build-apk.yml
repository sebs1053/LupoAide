name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Local Properties & Secrets
        run: |
          # Locate project directory
          TARGET_DIR="."
          if [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
            SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              TARGET_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          echo "Configuring in $TARGET_DIR"
          cd "$TARGET_DIR"

          # Create dummy .env file if required by secrets plugin / BuildConfig
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=dummy_key_for_build" > .env
          fi

          # Ensure local.properties points to Android SDK
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

      - name: Build with Gradle
        run: |
          TARGET_DIR="."
          if [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
            SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              TARGET_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi
          cd "$TARGET_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LupoAide-APK
          path: '**/build/outputs/apk/**/*.apk'
          retention-days: 14
