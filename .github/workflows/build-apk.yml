name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate and Build Project
        run: |
          echo "=== Diagnostic: Listing Repository Structure ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          # Find directory containing settings.gradle or settings.gradle.kts or build.gradle.kts
          BUILD_DIR=""
          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ] || [ -f "./build.gradle.kts" ]; then
            BUILD_DIR="."
          else
            SETTINGS_PATH=$(find . -name "settings.gradle*" | head -n 1)
            if [ -n "$SETTINGS_PATH" ]; then
              BUILD_DIR=$(dirname "$SETTINGS_PATH")
            fi
          fi

          if [ -z "$BUILD_DIR" ]; then
            echo "Searching for app folder..."
            APP_PATH=$(find . -type d -name "app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              BUILD_DIR=$(dirname "$APP_PATH")
            else
              BUILD_DIR="."
            fi
          fi

          echo "Found Android Project Root at: $BUILD_DIR"
          cd "$BUILD_DIR"

          # If gradlew wrapper is missing, generate or use gradle directly
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LupoAide-APK
          path: '**/*.apk'
          retention-days: 14
