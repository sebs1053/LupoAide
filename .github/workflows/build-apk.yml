name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          echo "=== 1. Searching for Android project root ==="
          TARGET_DIR="."
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            TARGET_DIR=$(dirname "$SETTINGS_FILE")
          fi
          echo "Found target project directory: $TARGET_DIR"
          cd "$TARGET_DIR"

          echo "=== 2. Setting up environment & SDK config ==="
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=dummy_key_for_build" > .env
          fi
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

          echo "=== 3. Running Gradle Build ==="
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --info
          else
            gradle assembleDebug --stacktrace --info
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LupoAide-APK
          path: '**/build/outputs/apk/**/*.apk'
          retention-days: 14
