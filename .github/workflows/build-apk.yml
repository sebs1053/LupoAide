name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          # Locate project root directory containing settings.gradle(.kts) or build.gradle(.kts)
          TARGET_DIR="."
          if [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
            SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              TARGET_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          echo "Moving into project directory: $TARGET_DIR"
          cd "$TARGET_DIR"

          # Use Gradle 8.11.1 without configuration cache to avoid KSP daemon reflection crashes
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LupoAide-APK
          path: '**/*.apk'
          retention-days: 14
