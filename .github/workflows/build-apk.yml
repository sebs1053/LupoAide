name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Setup Dummy Env & SDK Config
        run: |
          TARGET_DIR="."
          if [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
            SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              TARGET_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          echo "Working in: $TARGET_DIR"
          cd "$TARGET_DIR"

          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=dummy_key_for_build" > .env
          fi

          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

      - name: Build with Gradle
        run: |
          TARGET_DIR="."
          if [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
            SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              TARGET_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi
          cd "$TARGET_DIR"

          # Use gradle with compilation arguments, no daemon and no configuration cache to prevent KSP failure
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LupoAide-APK
          path: '**/build/outputs/apk/**/*.apk'
          retention-days: 14
